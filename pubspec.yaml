name: alembic
description: "Declarative Navigator 2.0 navigation for Flutter. The navigation state is a list of pages, guarded by pure rules and owned by one controller."
version: 0.6.0

homepage: https://github.com/gthe-miracle/alembic
repository: https://github.com/gthe-miracle/alembic
issue_tracker: https://github.com/gthe-miracle/alembic/issues

topics:
  - navigation
  - navigator
  - router
  - declarative
  - guards

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
